<h1>使用支持</h1>
<p>计算一道题、换算单位，或查看另一个城市的时间，都可以从方舟的应用列表开始。</p>
<h2>怎样开始使用？</h2><p>打开计算器输入算式，或进入单位换算，选择类别和单位后输入数值。世界时钟、秒表和时间换算也可以直接使用。</p>
<h2>换设备后能看到哪些记录？</h2><p>世界时钟等设备设置保存在本机。登录后保存的云端倒计时等账号记录，需要使用原账号并联网查看。</p>
<h2>遇到问题，或想管理个人信息？</h2><p>请发邮件至 <a href="mailto:249900679@qq.com">249900679@qq.com</a> 联系运营者欧客。反馈故障时，可写明设备型号、系统版本、操作步骤和看到的提示。涉及账号资料时，请勿发送密码或验证码。</p>
