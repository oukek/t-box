<body><header>T方舟</header><main><h1>随手计算，也看世界时间</h1>
<p>T方舟是 iPhone 和 iPad 上的日常工具集。</p>
<h2>烤箱上的 180°C 是多少华氏度？</h2><p>在「单位换算」选择温度，把摄氏度换成华氏度，180°C 就是 356°F。长度、面积和重量也可以用同样的方式换算。</p>
<h2>把整道算式输完</h2><p>在计算器中写下 128 × 3 + 56，查看结果 440。需要三角函数等运算时可以切换到科学计算。</p>
<h2>约个对方也方便的时间</h2><p>打开世界时钟，添加常联系的城市，比较当地时间。需要量一段时长时，可以切到秒表。</p>
