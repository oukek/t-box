name: 后端镜像发布（Docker / OSS）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-oss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create release ID
        id: release
        shell: bash
        run: |
          release="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          printf 'id=%s\ntag=t-box-api:%s\n' "$release" "$release" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Validate OSS application settings
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/upload-bootstrap-oss.mjs --check
      - name: Deployment script regressions
        run: node --test scripts/api-deployment.test.mjs scripts/oss-deployment.test.mjs scripts/oss-sdk.test.mjs
      - uses: docker/setup-buildx-action@v4
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Check isolated production runtime
        env:
          IMAGE: ${{ steps.release.outputs.tag }}
        run: |
          docker run --rm -e APP_ARTIFACT_ORIGIN=https://apps.example.invalid "$IMAGE" node check-image.mjs
      - name: Export application files for OSS only
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          target: application-artifacts
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/bootstrap-artifacts
          cache-from: type=gha,scope=api
      - name: Export compressed image and checksums
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: bash deploy/api/export-release.sh "$RELEASE_ID" "$RUNNER_TEMP/api-release"
      - name: Publish application files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/upload-bootstrap-oss.mjs "$RUNNER_TEMP/bootstrap-artifacts"
      - name: Upload public release to administration bucket Docker directory
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          test -n "$OSS_ACCESS_KEY_ID" && test -n "$OSS_ACCESS_KEY_SECRET" || { echo "Configure OSS AccessKey secrets"; exit 1; }
          bash deploy/api/upload-release.sh "$RELEASE_ID" "$RUNNER_TEMP/api-release"
      - name: Package standalone SDK deployment tools
        run: node scripts/pack-oss-tools.mjs "$RUNNER_TEMP/oss-deployment-tools"
      - uses: actions/upload-artifact@v7
        with:
          name: oss-deployment-tools
          path: ${{ runner.temp }}/oss-deployment-tools.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Deployment reference
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          printf 'Release: %s\n\nOSS: oss://%s/%s/releases/%s/\n\nServer: bash deploy-release.sh %s\n\nFirst install: bash deploy-release.sh %s --init\n' \
            "$RELEASE_ID" "$OSS_BUCKET" "$OSS_PREFIX" "$RELEASE_ID" "$RELEASE_ID" "$RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
