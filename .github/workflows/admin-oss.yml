name: 管理后台部署

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-oss-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: admin
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Validate website settings
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET" --check
      - name: 部署管理后台到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET"
