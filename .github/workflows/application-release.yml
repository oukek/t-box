name: Application OSS submission

on:
  workflow_dispatch:
    inputs:
      application:
        description: Independently buildable application
        type: choice
        required: true
        options:
          # BEGIN GENERATED APPLICATIONS
          - calculator
          - calendar
          - ledger
          - time
        # END GENERATED APPLICATIONS
      version:
        description: New version (e.g. 1.0.1; cannot replace an existing version)
        type: string
        required: true
      release_notes:
        description: Release notes shown in the administration panel
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: application-release-${{ inputs.application }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      APPLICATION: ${{ inputs.application }}
      VERSION: ${{ inputs.version }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes }}
      APP_RELEASE_OUTPUT: ${{ runner.temp }}/application-releases
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - uses: pnpm/action-setup@v6
      - name: Check generated application choices
        run: node scripts/generate-application-workflow.mjs --check
      - run: pnpm install --frozen-lockfile
      - name: Release script regressions
        run: node --test scripts/application-release.test.mjs scripts/oss-deployment.test.mjs
      - name: Build selected application and package static bundle
        run: node scripts/pack-application-release.mjs "$APPLICATION" "$VERSION"
      - name: Install verified ossutil 2.4.0
        run: bash deploy/oss/install-ossutil.sh
      - name: Upload to OSS and register submitted version (never publish)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # Configure once; the PM2 backend workflow synchronizes its hash automatically.
          APP_IMPORT_TOKEN: ${{ secrets.APP_IMPORT_TOKEN }}
        run: node scripts/submit-application-release.mjs "$APPLICATION" "$VERSION"
      - name: Submission reference
        run: |
          printf 'Application: %s\n\nVersion: %s\n\nBuild registered as submitted. Open the administration application page, review this version, then publish manually.\n' \
            "$APPLICATION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
