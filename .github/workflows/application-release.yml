name: 子应用发布（OSS）

on:
  workflow_dispatch:
    inputs:
      application:
        description: 选择单个或全部子应用（各应用版本号自动读取 manifest.version）
        type: choice
        required: true
        options:
          # eslint-disable yaml/plain-scalar
          # BEGIN GENERATED APPLICATIONS
          - '全部应用 (all)'
          - '宝宝日记 (baby-diary)'
          - '数学计算器 (calculator)'
          - '日历 (calendar)'
          - '单位换算 (converter)'
          - '记账 (ledger)'
          - '时间 (time)'
        # END GENERATED APPLICATIONS
        # eslint-enable yaml/plain-scalar

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applications: ${{ steps.selection.outputs.applications }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Resolve selected applications
        id: selection
        env:
          APPLICATION_SELECTION: ${{ inputs.application }}
        run: node scripts/plan-application-release.mjs "$APPLICATION_SELECTION"
  application:
    needs: plan
    name: 发布 ${{ matrix.application }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        application: ${{ fromJSON(needs.plan.outputs.applications) }}
    concurrency:
      group: application-release-${{ matrix.application }}
      cancel-in-progress: false
    env:
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      APPLICATION_SELECTION: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: 初始化应用发布输出目录
        run: printf 'APP_RELEASE_OUTPUT=%s/application-releases\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Build selected application and package static bundle
        run: node scripts/pack-application-release.mjs "$APPLICATION_SELECTION"
      - name: Upload to OSS and register submitted version (never publish)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # 首次部署、更换 Token 或新增应用授权时先部署后端；已有应用平时可独立更新。
          APP_IMPORT_TOKEN: ${{ secrets.APP_IMPORT_TOKEN }}
        run: node scripts/submit-application-release.mjs "$APPLICATION" "$VERSION"
      - name: Submission reference
        run: |
          printf 'Application: %s\n\nVersion (from manifest): %s\n\nBuild registered as submitted. Edit release notes and update prompts in the administration application page, then publish manually.\n' \
            "$APPLICATION" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
