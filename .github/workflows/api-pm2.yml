name: 后端部署（PM2）

on:
  workflow_dispatch:
    inputs:
      start_services:
        description: 上传后执行数据库迁移并启动 PM2
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: api-pm2-upload
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      PM2_UPLOAD_DIR: /www/wwwroot/tbox
      PM2_SSH_HOST: 8.163.69.101
      PM2_SSH_PORT: '22'
      PM2_SSH_USER: root
      PM2_START_SERVICES: ${{ inputs.start_services }}
      PM2_INIT_ADMIN: ${{ inputs.start_services }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate upload settings and create release ID
        id: release
        env:
          PM2_SSH_PRIVATE_KEY: ${{ secrets.PM2_SSH_PRIVATE_KEY }}
          PM2_SSH_PASSWORD: ${{ secrets.PM2_SSH_PASSWORD }}
        run: |
          test -n "$PM2_SSH_PASSWORD" || test -n "$PM2_SSH_PRIVATE_KEY" || { echo "Configure repository Secret PM2_SSH_PASSWORD (or PM2_SSH_PRIVATE_KEY for key authentication)"; exit 1; }
          test "$PM2_INIT_ADMIN" != true || test "$PM2_START_SERVICES" = true || { echo "Administrator initialization requires start_services"; exit 1; }
          printf 'id=sha-%s-run-%s-attempt-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - name: Validate application import token
        env:
          APP_IMPORT_TOKEN: ${{ secrets.APP_IMPORT_TOKEN }}
        run: node deploy/pm2/import-token.mjs --check
      - name: Validate OSS bootstrap settings
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/upload-bootstrap-oss.mjs --check
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: PM2 packaging and upload regressions
        run: node --test scripts/pm2-deployment.test.mjs scripts/oss-deployment.test.mjs
      - name: Build and validate standalone production package
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: node scripts/pack-api-pm2.mjs "$RELEASE_ID" "$RUNNER_TEMP/pm2-package"
      - name: Retain downloadable release package
        uses: actions/upload-artifact@v7
        with:
          name: pm2-${{ steps.release.outputs.id }}
          path: ${{ runner.temp }}/pm2-package/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Install verified ossutil
        run: bash deploy/oss/install-ossutil.sh
      - name: Publish exact bootstrap application files to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/upload-bootstrap-oss.mjs "$RUNNER_TEMP/pm2-package/bootstrap-artifacts"
      - name: Upload, verify and optionally start PM2
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          PM2_SSH_PRIVATE_KEY: ${{ secrets.PM2_SSH_PRIVATE_KEY }}
          PM2_SSH_PASSWORD: ${{ secrets.PM2_SSH_PASSWORD }}
          APP_IMPORT_TOKEN: ${{ secrets.APP_IMPORT_TOKEN }}
        run: |
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/tbox-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          node deploy/pm2/import-token.mjs "$ssh_dir/import-token.sha256"
          unset APP_IMPORT_TOKEN
          export PM2_IMPORT_TOKEN_HASH_FILE="$ssh_dir/import-token.sha256"
          if [ -n "$PM2_SSH_PASSWORD" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sshpass
          else
            printf '%s\n' "$PM2_SSH_PRIVATE_KEY" > "$ssh_dir/key"
            export PM2_SSH_KEY_FILE="$ssh_dir/key"
          fi
          bash deploy/pm2/upload-runtime.sh "$RELEASE_ID" "$RUNNER_TEMP/pm2-package"
      - name: Deployment result
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          printf 'Verified release directory: %s/releases/%s\n\n' "$PM2_UPLOAD_DIR" "$RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PM2_START_SERVICES" = true ]; then
            printf 'Database migrations, PM2 startup and health checks passed.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Upload only. Run node control/start-release.mjs in the release directory to migrate and start PM2.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
