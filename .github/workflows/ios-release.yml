name: iOS 发包（App Store）
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 构建号（留空用本工作流运行序号，已上传过的构建号不能重复）
        type: string
      upload:
        description: 上传到 App Store Connect，稍后手动选择构建并送审
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-app-store
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-release
    env:
      APP_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v6
      - name: 核对版本与构建环境
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          OSS_REGION: ${{ vars.OSS_REGION }}
        run: |
          version=$(node --input-type=module -e "import { releaseVersions } from './scripts/release-versions.mjs'; console.log(releaseVersions.ios)")
          echo "IOS_MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          [[ "$APP_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          node deploy/settings.mjs
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
          pod --version
      - run: pnpm install --frozen-lockfile
      - name: 构建并同步 iOS 生产资源
        run: VITE_API_BASE_URL="$API_BASE_URL" node scripts/native.mjs sync ios
      - name: 签名归档并导出 IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/ios/archive.sh
      - name: 保留签名安装包
        uses: actions/upload-artifact@v7
        with:
          name: Tbox-iOS-${{ env.IOS_MARKETING_VERSION }}-${{ env.APP_BUILD_NUMBER }}
          path: output/ios/Tbox.ipa
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: 上传到 App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eu
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]]
          : "${ASC_ISSUER_ID:?缺少 ASC_ISSUER_ID}" "${ASC_KEY_P8_BASE64:?缺少 ASC_KEY_P8_BASE64}"
          umask 077
          export API_PRIVATE_KEYS_DIR="$(mktemp -d)"
          trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f output/ios/Tbox.ipa --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
