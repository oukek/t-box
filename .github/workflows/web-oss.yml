name: Web OSS deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Website to deploy
        type: choice
        default: all
        options: [all, app, admin]

permissions:
  contents: read

concurrency:
  group: web-oss-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      OSS_REGION: ${{ vars.OSS_REGION }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      WEB_OSS_BUCKET: ${{ vars.WEB_OSS_BUCKET }}
      ADMIN_OSS_BUCKET: ${{ vars.ADMIN_OSS_BUCKET }}
      APPS_OSS_BUCKET: ${{ vars.APPS_OSS_BUCKET }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
      APP_ARTIFACT_ORIGIN: ${{ vars.APP_ARTIFACT_ORIGIN }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Validate website settings
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET" --check
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Check and test deployment scripts
        run: pnpm lint && node --test scripts/oss-deployment.test.mjs
      - name: Install verified ossutil
        run: bash deploy/oss/install-ossutil.sh
      - name: Build, upload and verify websites
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_SESSION_TOKEN: ${{ secrets.OSS_SESSION_TOKEN }}
        run: node scripts/deploy-web-oss.mjs "$TARGET"
