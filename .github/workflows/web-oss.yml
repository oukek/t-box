name: Web OSS deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Website to deploy
        type: choice
        default: all
        options: [all, app, admin]

permissions:
  contents: read

concurrency:
  group: web-oss-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - name: Validate website settings
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET" --check
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Check and test deployment scripts
        run: pnpm lint && node --test scripts/oss-deployment.test.mjs
      - name: Install verified ossutil
        run: bash deploy/oss/install-ossutil.sh
      - name: Build, upload and verify websites
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET"
