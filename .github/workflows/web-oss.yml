name: 前端与后台部署（OSS）

on:
  workflow_dispatch:
    inputs:
      target:
        description: 选择发布站点（all=全部，app=主前端，admin=管理后台）
        type: choice
        default: all
        options: [all, app, admin]
      ui_change:
        description: 主界面版本递增方式（仅发布后台时保持默认）
        type: choice
        default: patch
        options: [patch, minor, major, manual]
      ui_version:
        description: 手动目标版本（选 manual 时填写，如 1.1.15）
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: web-oss-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      OSS_REGION: ${{ vars.OSS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Prepare fixed deployment settings
        run: node deploy/settings.mjs
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Validate website settings
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET" --check
      - name: Build shared error definitions
        run: pnpm --filter @t-box/errors build
      - name: Reserve main interface version
        env:
          UI_CHANGE: ${{ inputs.ui_change }}
          UI_VERSION: ${{ inputs.ui_version }}
          APP_IMPORT_TOKEN: ${{ secrets.APP_IMPORT_TOKEN }}
        run: node scripts/reserve-web-version.mjs
      - name: 提交主界面候选并部署选中的管理后台
        env:
          APP_IMPORT_TOKEN: ${{ secrets.APP_IMPORT_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-web-oss.mjs "$TARGET"
