name: 主界面构建（网页、PWA、Mac）
run-name: ${{ inputs.release_key || '主界面构建（网页、PWA、Mac）' }}
on:
  workflow_dispatch:
    inputs:
      release_key:
        description: 本地发版脚本跟踪编号（手动运行请留空）
        type: string
        required: false

permissions:
  contents: read

jobs:
  candidate:
    if: ${{ !inputs.release_key || startsWith(inputs.release_key, format('{0}-', github.sha)) }}
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit
    with:
      components: ui
