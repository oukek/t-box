name: t-box

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an imported local image tag}
    pull_policy: never
    restart: unless-stopped
    init: true
    # Linux + host-installed MySQL/Redis/Nginx; no public port publishing.
    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: ${API_PORT:-3000}
    volumes:
      - ./data/secrets:/opt/t-box/api/.secrets
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
