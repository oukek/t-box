<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>方舟 · 待办事项</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24232a;
      --muted: #6c6977;
      --line: #e9e8ec;
      --accent: #6b4ab0;
      --wash: #f2edf9;
      color: var(--ink);
      font:
        14px/1.55 "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        sans-serif;
      background: #fff;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    button,
    input {
      font: inherit;
    }
    button {
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    h1,
    h2,
    p {
      margin: 0;
    }
    small {
      font-size: 12px;
      color: var(--muted);
    }
    header {
      position: fixed;
      inset: 0 auto 0 0;
      width: 212px;
      background: #f7f7f9;
      border-right: 1px solid var(--line);
      padding: 35px 19px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 17px;
    }
    .mark {
      width: 23px;
      height: 23px;
      background: var(--ink);
      color: white;
      border-radius: 7px;
      text-align: center;
      font: 600 17px/23px system-ui;
    }
    .mark:after {
      content: "✓";
    }
    .host {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 6px 0 34px 32px;
    }
    nav {
      display: grid;
      gap: 5px;
    }
    nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 11px 13px;
      border-radius: 8px;
      color: var(--muted);
    }
    nav button.active {
      background: #e9e7ed;
      color: var(--ink);
      font-weight: 650;
    }
    main {
      margin-left: 212px;
      padding: 56px max(5vw, 30px);
      max-width: 1260px;
    }
    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -0.055em;
      line-height: 1.3;
    }
    .heading p,
    .cap {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .primary {
      background: var(--ink);
      color: white;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 600;
    }
    .plain {
      border: 1px solid var(--line);
      padding: 7px 12px;
      border-radius: 7px;
    }
    .switcher {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .switcher button {
      border-radius: 20px;
      padding: 6px 14px;
      color: var(--muted);
    }
    .switcher .active {
      background: var(--wash);
      color: var(--accent);
      font-weight: 650;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 24px 0 10px;
    }
    .section-head h2 {
      font-size: 16px;
    }
    .panel {
      margin-bottom: 10px;
    }
    .row,
    .item-link {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 13px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      min-height: 68px;
    }
    .text,
    .item-text {
      flex: 1;
      text-align: left;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .text strong,
    .item-text strong {
      font-size: 15px;
      font-weight: 570;
      display: block;
    }
    .text small,
    .item-text small {
      display: block;
      margin-top: 2px;
    }
    .check,
    .row .plain {
      width: 23px;
      height: 23px;
      flex: none;
      border: 1.5px solid #bbb9c3;
      border-radius: 50%;
      padding: 0;
    }
    .row .plain {
      border: 0;
      color: var(--accent);
      font-size: 20px;
    }
    .check.done {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .done + .text strong,
    .finished {
      text-decoration: line-through;
      color: var(--muted);
    }
    .urgent {
      font-size: 11px;
      color: #ab4231;
    }
    .empty,
    .summary {
      padding: 18px 0;
      color: var(--muted);
    }
    .item-link {
      padding: 14px 0;
      min-height: 85px;
    }
    .item-icon {
      width: 40px;
      height: 42px;
      background: var(--wash);
      border-radius: 10px;
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .chev {
      color: #807d89;
    }
    .back {
      padding: 0 0 18px;
      color: var(--accent);
    }
    .sublist label {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      border-bottom: 1px solid var(--line);
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .numbers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #f6f5f8;
      border-radius: 13px;
      padding: 16px 4px;
    }
    .metric {
      text-align: left;
      padding: 0 16px;
      color: var(--muted);
      border-right: 1px solid #dfdde5;
      font-size: 13px;
    }
    .metric:last-child {
      border: 0;
    }
    .metric b {
      display: block;
      font: 550 34px/1.35 system-ui;
      color: var(--ink);
    }
    .chart {
      display: flex;
      align-items: end;
      justify-content: space-around;
      border-bottom: 1px solid var(--line);
      height: 152px;
    }
    .chart button {
      display: grid;
      align-content: end;
      justify-items: center;
      gap: 4px;
      padding: 0 0 7px;
      flex: 1;
    }
    .chart i {
      width: 18px;
      background: #d0c3e5;
      border-radius: 4px;
    }
    .chart button:nth-child(3) i {
      background: var(--accent);
    }
    .plan-card,
    .side-link {
      width: 100%;
      display: block;
      text-align: left;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .plan-card strong {
      display: block;
    }
    .plan-card > small:first-child {
      display: none;
    }
    .plan-card span {
      color: var(--muted);
      font-size: 12px;
    }
    .bar {
      height: 4px;
      background: #eeeaf2;
      margin: 8px 0;
      border-radius: 3px;
    }
    .bar i {
      display: block;
      height: 100%;
      background: #b3a0cc;
    }
    .side-link {
      display: flex;
      justify-content: space-between;
    }
    .columns {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 32px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 22px;
    }
    dialog {
      width: min(440px, 93vw);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      max-height: 90dvh;
      overflow: auto;
      color: var(--ink);
    }
    dialog::backdrop {
      background: #22212b55;
    }
    .field {
      display: grid;
      gap: 6px;
      margin: 14px 0;
    }
    .field input {
      border: 1px solid #cac8d1;
      border-radius: 8px;
      padding: 10px;
      min-width: 0;
    }
    @media (max-width: 730px) {
      header {
        position: static;
        width: auto;
        background: white;
        border: 0;
        padding: 15px 20px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-size: 13px;
      }
      .mark {
        width: 19px;
        height: 19px;
        font-size: 13px;
        line-height: 19px;
      }
      .host {
        margin: 0;
        font-size: 11px;
      }
      nav {
        position: fixed;
        inset: auto 0 0;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: #fffffff7;
        border-top: 1px solid var(--line);
        padding: 7px 5px max(8px, env(safe-area-inset-bottom));
        gap: 0;
      }
      nav button {
        flex-direction: column;
        justify-content: center;
        padding: 3px;
        gap: 2px;
        font-size: 11px;
      }
      nav button.active {
        background: transparent;
        color: var(--accent);
      }
      main {
        margin: 0;
        padding: 28px 20px 88px;
      }
      .heading {
        margin-bottom: 22px;
      }
      h1 {
        font-size: 29px;
      }
      .primary {
        font-size: 13px;
        padding: 9px 12px;
      }
      .switcher {
        gap: 2px;
      }
      .switcher button {
        padding: 5px 11px;
      }
      .columns {
        display: block;
      }
      .metric {
        padding: 0 10px;
      }
      .metric b {
        font-size: 29px;
      }
      .section-head {
        padding-top: 20px;
      }
      dialog {
        margin: auto auto 0;
        max-width: 100%;
        width: 100%;
        border-radius: 17px 17px 0 0;
      }
    }
  </style>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>待办事项
    </div>
    <span class="host">T 方舟</span>
    <nav id="nav" aria-label="主导航"></nav>
  </header>
  <main id="screen"></main>
  <dialog id="modal">
    <form id="form">
      <div id="body"></div>
      <div class="actions">
        <button class="plain" type="button" onclick="modal.close()">关闭</button
        ><button class="primary" id="save">保存</button>
      </div>
    </form>
  </dialog>
  <script>
    const names = ["我的待办", "循环清单", "长期计划", "统计"],
      days = ["一", "二", "三", "四", "五", "六", "日"],
      dates = [23, 24, 25, 26, 27, 28, 29];
    const groups = [
      {
        name: "整理冰箱",
        rule: "每周三",
        date: 2,
        steps: ["查看食物保质期", "擦拭隔板", "列出采购清单"],
        done: [true, false, false],
      },
      {
        name: "给花换水",
        rule: "每 3 天",
        date: 4,
        steps: ["清洗花瓶", "修剪花枝", "换水"],
        done: [false, false, false],
      },
      {
        name: "备份家庭照片",
        rule: "每月 28 日",
        date: 5,
        steps: ["整理相册", "备份到硬盘"],
        done: [false, false],
      },
    ];
    const plans = [
      {
        name: "周末旅行准备",
        rule: "11 月 20 日 — 11 月 28 日",
        steps: [
          "确定出发日期",
          "订好车票",
          "确认住宿能否寄存行李",
          "整理随身行李",
        ],
        done: [true, true, false, false],
        dates: [-2, -2, 2, 4],
      },
    ];
    plans.push({
      name: "十二月搬家",
      rule: "12 月 1 日 — 20 日",
      steps: ["量家具尺寸", "预约搬运", "打包装箱"],
      done: [false, false, false],
      dates: [-1, -1, -1],
    });
    const tasks = [
      { name: "归还图书馆的借书", date: 2, time: "15:00", urgent: true },
      { name: "预约自行车保养", date: 3 },
      { name: "领取配好的眼镜", date: 5 },
      { name: "买充电电池", date: -1 },
      { name: "寄出明信片", date: 2, done: true },
    ];
    let tab = 0,
      day = 2,
      filter = "安排",
      openGroup = 0,
      openPlan = 0,
      onSave;
    const el = (id) => document.getElementById(id),
      esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
    function go(t) {
      viewing = false;
      if (t === 0) {
        day = 2;
        filter = "安排";
      }
      window.scrollTo(0, 0);
      tab = t;
      render();
    }
    function chooseDay(i) {
      tab = 0;
      filter = "安排";
      day = i;
      render();
    }
    function pageHead(title, note, action) {
      return (
        '<div class="heading"><div><h1>' +
        title +
        "</h1><p>" +
        note +
        "</p></div>" +
        action +
        "</div>"
      );
    }
    const addBtn = (label, kind) =>
      '<button class="primary" onclick="createItem(' +
      kind +
      ')">＋ ' +
      label +
      "</button>";
    const heading = (title, right = "") =>
      '<div class="section-head"><h2>' +
      title +
      "</h2><small>" +
      right +
      "</small></div>";
    function entries() {
      return [
        ...tasks.map((t, i) => ({
          ...t,
          kind: 0,
          i,
          meta: t.time || "待办事项",
        })),
        ...groups.map((g, i) => ({
          name: g.name,
          date: g.date,
          done: g.done.every(Boolean),
          i,
          kind: 1,
          meta:
            g.rule +
            " · " +
            g.done.filter(Boolean).length +
            "/" +
            g.steps.length +
            " 项",
        })),
        ...plans.flatMap((p, i) =>
          p.steps.map((n, j) => ({
            name: n,
            date: p.dates[j],
            done: p.done[j],
            i,
            j,
            kind: 2,
            meta: p.name,
          })),
        ),
      ];
    }
    function toggle(k, i, j) {
      if (k === 0) tasks[i].done = !tasks[i].done;
      else if (k === 2) plans[i].done[j] = !plans[i].done[j];
      render();
    }
    function details(k, i) {
      tab = k;
      viewing = true;
      if (k === 1) openGroup = i;
      else openPlan = i;
      window.scrollTo(0, 0);
      render();
    }
    function row(t) {
      let link =
        t.kind === 0
          ? "editTask(" + t.i + ")"
          : "details(" + t.kind + "," + t.i + ")";
      return (
        '<div class="row">' +
        (t.kind === 1
          ? '<button class="plain" aria-label="展开循环清单" onclick="' +
            link +
            '">↻</button>'
          : '<button aria-label="切换完成状态" aria-pressed="' +
            !!t.done +
            '" class="check ' +
            (t.done ? "done" : "") +
            '" onclick="toggle(' +
            [t.kind, t.i, t.j ?? 0] +
            ')">' +
            (t.done ? "✓" : "") +
            "</button>") +
        '<button class="text" onclick="' +
        link +
        '"><strong>' +
        esc(t.name) +
        "</strong><small>" +
        esc(t.meta) +
        "</small></button>" +
        (t.urgent ? '<span class="urgent">紧急</span>' : "") +
        "</div>"
      );
    }
    function showFilter(f) {
      filter = f;
      tab = 0;
      render();
    }
    function planTile(p, i) {
      return (
        '<button class="plan-card" onclick="details(2,' +
        i +
        ')"><small>长期计划</small><strong>' +
        esc(p.name) +
        "</strong><span>" +
        esc(p.rule) +
        '</span><div class="bar"><i style="width:' +
        (100 * p.done.filter(Boolean).length) / p.steps.length +
        '%"></i></div><small>已完成 ' +
        p.done.filter(Boolean).length +
        " / " +
        p.steps.length +
        " 项　›</small></button>"
      );
    }
    function filterByIndex(i) {
      showFilter(["安排", "稍后", "未安排", "已完成"][i]);
    }
    function home() {
      const opts = ["安排", "稍后", "未安排", "已完成"];
      const list = entries()
        .filter((t) =>
          filter === "已完成"
            ? t.done
            : !t.done &&
              (filter === "稍后"
                ? t.date > day
                : filter === "未安排"
                  ? t.date === -1
                  : t.date === day),
        )
        .sort((a, b) => a.date - b.date);
      return (
        pageHead(
          "我的待办",
          "11 月 " + dates[day] + " 日 · 星期" + days[day],
          addBtn("新建", 0),
        ) +
        '<div class="switcher">' +
        opts
          .map(
            (f) =>
              '<button class="' +
              (filter === f ? "active" : "") +
              '" onclick="filterByIndex(' +
              opts.indexOf(f) +
              ')">' +
              (f === "安排" ? (day === 2 ? "今天" : "当日") : f) +
              "</button>",
          )
          .join("") +
        "</div>" +
        '<section class="panel">' +
        heading(filter === "安排" ? "待处理" : filter, list.length + " 件") +
        (list
          .map((t) =>
            row(
              filter === "稍后"
                ? { ...t, meta: "11 月 " + dates[t.date] + " 日 · " + t.meta }
                : t,
            ),
          )
          .join("") || '<p class="empty">这里暂时没有事项</p>') +
        "</section>"
      );
    }
    let viewing = false;
    function collection(k) {
      const group = k === 1,
        arr = group ? groups : plans,
        idx = group ? openGroup : openPlan,
        p = arr[idx];
      if (viewing)
        return (
          '<button class="back" onclick="go(' +
          k +
          ')">‹　' +
          names[k] +
          "</button>" +
          pageHead(esc(p.name), esc(p.rule), "") +
          heading(
            group ? "本期检查项" : "计划子事项",
            p.done.filter(Boolean).length + " / " + p.steps.length,
          ) +
          '<div class="sublist">' +
          p.steps
            .map(
              (n, j) =>
                '<label><input type="checkbox" ' +
                (p.done[j] ? "checked" : "") +
                ' onchange="toggleSubitem(' +
                [k, idx, j] +
                ')">' +
                esc(n) +
                "</label>",
            )
            .join("") +
          "</div>"
        );
      return (
        pageHead(
          names[k],
          group
            ? "共 " + arr.length + " 份清单"
            : "共 " + arr.length + " 个计划",
          addBtn("新建", k),
        ) +
        arr
          .map(
            (v, i) =>
              '<button class="item-link" onclick="details(' +
              k +
              "," +
              i +
              ')"><span class="item-icon">' +
              navIcon(k) +
              '</span><span class="item-text"><strong>' +
              esc(v.name) +
              "</strong><small>" +
              esc(v.rule) +
              "</small></span><small>" +
              v.done.filter(Boolean).length +
              " / " +
              v.steps.length +
              '</small><span class="chev">›</span></button>',
          )
          .join("")
      );
    }
    function toggleSubitem(k, i, j) {
      let p = (k === 1 ? groups : plans)[i];
      p.done[j] = !p.done[j];
      render();
    }
    function inspect(title, items) {
      dialog(
        title,
        items.length
          ? items.map((x) => '<p class="summary">' + esc(x) + "</p>").join("")
          : '<p class="empty">暂无事项</p>',
        null,
      );
    }
    function stats() {
      let a = entries(),
        pending = a.filter((t) => !t.done),
        metrics = [
          pending,
          pending.filter((t) => t.urgent),
          a.filter((t) => t.done),
        ],
        labels = ["待处理", "紧急待办", "已完成"];
      window.metric = (i) =>
        inspect(
          labels[i],
          metrics[i].map((t) => t.name),
        );
      return (
        pageHead("个人统计", "当前事项与本周安排", "") +
        '<div class="numbers">' +
        metrics
          .map(
            (m, i) =>
              '<button class="metric" onclick="metric(' +
              i +
              ')">' +
              labels[i] +
              "<b>" +
              m.length +
              "</b></button>",
          )
          .join("") +
        '</div><div class="columns"><section class="panel">' +
        heading("本周待办分布", "11 月 23 日 — 29 日") +
        '<div class="chart">' +
        days
          .map((d, i) => {
            let n = pending.filter((t) => t.date === i).length;
            return (
              '<button aria-label="查看周' +
              d +
              '安排" onclick="chooseDay(' +
              i +
              ')"><b>' +
              n +
              '</b><i style="height:' +
              (n ? Math.min(75, n * 18) : 2) +
              'px"></i><small>周' +
              d +
              "</small></button>"
            );
          })
          .join("") +
        '</div></section><section class="panel">' +
        heading("计划进度") +
        plans.map(planTile).join("") +
        '</section></div><section class="panel">' +
        heading("循环清单概览") +
        groups
          .map(
            (g, i) =>
              '<button class="side-link" onclick="details(1,' +
              i +
              ')">' +
              esc(g.name) +
              "<small>" +
              esc(g.rule) +
              "　" +
              g.done.filter(Boolean).length +
              " / " +
              g.steps.length +
              " 项　›</small></button>",
          )
          .join("") +
        "</section>"
      );
    }
    const symbols = [
      "M4 6h16M4 12h16M4 18h10",
      "M6 7h11l-3-3m4 13H7l3 3M19 7c2 2 2 5 1 7M5 17c-2-2-2-5-1-7",
      "M4 6h6l2 2h8v11H4z",
      "M4 20h17M7 16v-4m5 4V5m5 11V9",
    ];
    function navIcon(i) {
      return (
        '<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' +
        symbols[i] +
        '"/></svg>'
      );
    }
    function render() {
      document.body.dataset.page = tab;
      el("nav").innerHTML = names
        .map(
          (n, i) =>
            '<button class="' +
            (tab === i ? "active" : "") +
            '" onclick="go(' +
            i +
            ')">' +
            navIcon(i) +
            n +
            "</button>",
        )
        .join("");
      el("screen").innerHTML =
        tab === 0 ? home() : tab === 3 ? stats() : collection(tab);
      [...document.querySelectorAll(".sublist label")].forEach((label) =>
        label.classList.toggle(
          "finished",
          label.querySelector("input").checked,
        ),
      );
    }
    function dialog(title, html, cb) {
      onSave = cb;
      el("body").innerHTML = "<h2>" + title + "</h2>" + html;
      el("save").hidden = !cb;
      el("modal").showModal();
    }
    function createItem(k, existing) {
      let t = existing === undefined ? null : tasks[existing];
      dialog(
        (t ? "编辑" : "新建") + ["待办", "循环清单", "计划"][k],
        '<label class="field">名称<input id="itemName" required maxlength="100" value="' +
          esc(t?.name) +
          '"></label>' +
          (k === 0
            ? '<label><input id="flag" type="checkbox" ' +
              (t?.urgent ? "checked" : "") +
              "> 紧急事项</label>"
            : '<label class="field">' +
              (k === 1 ? "重复安排" : "计划日期") +
              '<input id="rule" required placeholder="' +
              (k === 1 ? "例如，每两周周三" : "例如，12 月 1 日至 20 日") +
              '"></label><label class="field">' +
              (k === 1 ? "检查项" : "子事项") +
              '<input id="steps" required placeholder="多项用顿号分隔"></label>'),
        () => {
          let n = el("itemName").value.trim();
          if (!n) return false;
          if (k === 0) {
            if (t) {
              t.name = n;
              t.urgent = el("flag").checked;
            } else
              tasks.push({
                name: n,
                urgent: el("flag").checked,
                date: filter === "未安排" ? -1 : day,
              });
            if (filter === "已完成") filter = "安排";
          } else {
            let ss = el("steps")
              .value.split("、")
              .map((x) => x.trim())
              .filter(Boolean);
            if (!ss.length) return false;
            let p = {
              name: n,
              rule: el("rule").value,
              steps: ss,
              done: ss.map(() => false),
              dates: ss.map(() => -1),
              date: day,
            };
            if (k === 1) openGroup = groups.push(p) - 1;
            else openPlan = plans.push(p) - 1;
          }
          render();
        },
      );
    }
    function editTask(i) {
      createItem(0, i);
    }
    el("form").onsubmit = (e) => {
      e.preventDefault();
      if (onSave?.() !== false) el("modal").close();
    };
    render();
  </script>
</html>
