packages:
  - app
  - admin
  - api
  - capacitor
  - capacitor-plugins/*
  - shared
  - deploy/oss
  - packages/*
  - apps/*/core
  - apps/*/contracts
  - apps/*/server
  - apps/*/web
  - apps/*/shell

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - playwright-core@1.64.1
  - playwright@1.64.1
